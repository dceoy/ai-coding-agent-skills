---
name: Package agent skills
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: package.json
      - name: Build TypeScript scripts
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package skills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-skill-packages"
          shopt -s nullglob
          skill_files=(skills/*/SKILL.md)
          (( ${#skill_files[@]} > 0 )) || { echo "::error::No skills found"; exit 1; }
          for skill_file in "${skill_files[@]}"; do
            skill_dir="$(dirname -- "${skill_file}")"
            skill_name="$(basename -- "${skill_dir}")"
            if [[ -n "$(find "${skill_dir}" -type l -print -quit)" ]]; then
              echo "::error::Symlink in skill: ${skill_name}"
              exit 1
            fi
            (
              cd skills
              zip -q -r -X "${RUNNER_TEMP}/agent-skill-packages/${skill_name}.zip" -- "${skill_name}"
            )
          done
          unzip -Z1 "${RUNNER_TEMP}/agent-skill-packages/gas-html-artifact.zip" |
            grep -Fx 'gas-html-artifact/scripts/deploy.mjs'
      - name: Upload packaged skills
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agent-skills
          path: ${{ runner.temp }}/agent-skill-packages/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  attach-to-release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged skills
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: agent-skills
          path: ${{ runner.temp }}/agent-skill-release-assets
      - name: Attach packaged skills to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=("${RUNNER_TEMP}/agent-skill-release-assets"/*.zip)
          (( ${#assets[@]} > 0 )) || { echo "::error::No skill packages"; exit 1; }
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${REPOSITORY}" --clobber
