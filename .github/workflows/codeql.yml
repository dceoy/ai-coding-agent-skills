---
name: CodeQL
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
      - '**/*.py'
      - '**/*.pyi'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/requirements*.txt'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
      - '**/*.py'
      - '**/*.pyi'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/requirements*.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-codeql-analysis:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@fce8635a412621492802f4760a57e9323dddedab
    with:
      language: >
        ["actions","python"]
