[project]
name = "local-qa"
version = "0.1.0"
description = "Local QA tooling (format, lint, typecheck, and test) for ai-coding-agent-skills"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.11, < 3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "statsmodels>=0.15.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/dceoy/ai-coding-agent-skills.git"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff >= 0.11.0",
    "pyright >= 1.1.407",
    "pytest >= 8.0.0",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",  # flake8-copyright (CPY)
    "COM812", # missing-trailing-comma
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
]

[tool.ruff.lint.per-file-ignores]
"**/scripts/**/*.py" = [
    "S404", # subprocess required for git/gh invocation
    "T201", # CLI output via print
]
"skills/github-productivity/scripts/{ghapi,workdir}.py" = [
    "S603", # subprocess call with a fixed, non-shell argument vector
    "S607", # `gh`/`git` are invoked via PATH by design, matching CLI convention
]
"tests/**/*.py" = [
    "DOC201", # Missing return documentation
    "DOC501", # Raised exception missing from docstring
    "PLC2701", # Private name import
    "PLR0904", # Too many public methods
    "PLR2004", # Magic value used in comparison
    "PLR6301", # Method could be function/static/classmethod
    "S101", # Use of assert (acceptable in tests)
    "S106", # Possible hardcoded password
    "SLF001", # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
include = ["skills"]
exclude = ["build", ".venv", "**/__pycache__"]
extraPaths = ["skills/github-productivity/scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--capture=no",
]
pythonpath = [".", "skills/github-productivity/scripts"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"
