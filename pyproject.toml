[project]
name = "local-qa"
version = "0.1.0"
description = "Local QA tooling (format, lint, typecheck, and test) for ai-coding-agent-skills"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.11, < 3.14"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/dceoy/ai-coding-agent-skills.git"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff >= 0.11.0",
    "pyright >= 1.1.407",
    "pytest >= 8.0.0",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = [
    "F", # Pyflakes (F)
    "E", # pycodestyle error (E)
    "W", # pycodestyle warning (W)
    "C90", # mccabe (C90)
    "I", # isort (I)
    "N", # pep8-naming (N)
    "D", # pydocstyle (D)
    "UP", # pyupgrade (UP)
    "S", # flake8-bandit (S)
    "B", # flake8-bugbear (B)
    "C4", # flake8-comprehensions (C4)
    "SIM", # flake8-simplify (SIM)
    "ARG", # flake8-unused-arguments (ARG)
    "PLC", # Pylint convention (PLC)
    "PLE", # Pylint error (PLE)
    "PLR", # Pylint refactor (PLR)
    "PLW", # Pylint warning (PLW)
    "FLY", # flynt (FLY)
    "PERF", # Perflint (PERF)
    "FURB", # refurb (FURB)
    "RUF", # Ruff-specific rules (RUF)
    "YTT", # flake8-2020 (YTT)
    "ANN", # flake8-annotations (ANN)
    "ASYNC", # flake8-async (ASYNC)
    "BLE", # flake8-blind-except (BLE)
    "FBT", # flake8-boolean-trap (FBT)
    "A", # flake8-builtins (A)
    "COM", # flake8-commas (COM)
    "DTZ", # flake8-datetimez (DTZ)
    "T10", # flake8-debugger (T10)
    "EM", # flake8-errmsg (EM)
    "EXE", # flake8-executable (EXE)
    "FA", # flake8-future-annotations (FA)
    "ISC", # flake8-implicit-str-concat (ISC)
    "ICN", # flake8-import-conventions (ICN)
    "LOG", # flake8-logging (LOG)
    "G", # flake8-logging-format (G)
    "INP", # flake8-no-pep420 (INP)
    "PIE", # flake8-pie (PIE)
    "T20", # flake8-print (T20)
    "PYI", # flake8-pyi (PYI)
    "PT", # flake8-pytest-style (PT)
    "Q", # flake8-quotes (Q)
    "RSE", # flake8-raise (RSE)
    "SLF", # flake8-self (SLF)
    "SLOT", # flake8-slots (SLOT)
    "TID", # flake8-tidy-imports (TID)
    "TCH", # flake8-type-checking (TCH)
    "INT", # flake8-gettext (INT)
    "PTH", # flake8-use-pathlib (PTH)
    "TD", # flake8-todos (TD)
    "FIX", # flake8-fixme (FIX)
    "ERA", # eradicate (ERA)
    "PGH", # pygrep-hooks (PGH)
    "TRY", # tryceratops (TRY)
    "DOC", # pydoclint (DOC)
]
ignore = [
    "COM812", # missing-trailing-comma
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
]

[tool.ruff.lint.per-file-ignores]
"**/scripts/**/*.py" = [
    "S404", # subprocess required for git invocation
    "T201", # CLI output via print
    "S603", # subprocess call with a fixed, non-shell argument vector
    "S607", # `gh` is invoked via PATH by design, matching the `gh` CLI convention
]
"tests/**/*.py" = [
    "DOC201", # Missing return documentation
    "DOC501", # Raised exception missing from docstring
    "PLC2701", # Private name import
    "PLR0904", # Too many public methods
    "PLR2004", # Magic value used in comparison
    "PLR6301", # Method could be function/static/classmethod
    "S101", # Use of assert (acceptable in tests)
    "S106", # Possible hardcoded password
    "SLF001", # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
include = ["skills"]
exclude = ["build", ".venv", "**/__pycache__"]
extraPaths = ["skills/github-productivity/scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--capture=no",
]
pythonpath = [".", "skills/github-productivity/scripts"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"
